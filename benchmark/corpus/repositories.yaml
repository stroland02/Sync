# The repositories the frozen corpus is scored over, pinned by commit.
#
# `benchmark/corpus/README.md` argues the selection. `scripts/fetch_corpus_repositories.py`
# turns this file into trees under the gitignored `.cache/corpus/`, and refuses when a
# materialised tree does not match the digest recorded here.
#
#   name         what the specifications and the score name this checkout by
#   repo         owner/name on GitHub
#   commit       the pin; the fetch asks for this commit by name rather than for a branch
#   subpath      the directory inside that checkout the score is taken over, when the
#                repository's `package.json` is not at its root
#   tree_digest  SHA-256 over every materialised path and the SHA-256 of its bytes, sorted.
#                It covers the vendor's subtree at the pinned commit as published, minus only
#                `.git` and `node_modules`. Every file is hashed as bytes and none is decoded.
#
# What the digest covers changed on 2026-07-29, and the pinned commits did not.
#
# The fetcher used to remove every file that does not decode as UTF-8 before hashing, because
# the scorer read the whole checkout as text and one PNG ended the run. So the digest pinned
# what our own filter left behind rather than what the vendor published -- it validated that we
# transform a tree the same way today as yesterday, which is not a property worth freezing.
# `sync.benchmark.checkout.read_checkout` now skips what it cannot read as source and names the
# paths beside the score, so the fetch copies the subtree verbatim and the digest means what a
# reader already assumed it meant.
#
# Two of the four moved: `furever` gained 63 images and fonts and `remix` gained one. `turbo`
# and `fireship-server` carry no undecodable file at all, so their digests are unchanged and
# were never affected by the old pruning. A mismatch here is still a real refusal -- it is not
# evidence that a vendor moved a commit, and the commits below are the same commits they were.
#
# What the digest covers changed again on 2026-07-30, and the pinned commits still did not.
#
# The digests below were produced by a Windows checkout and could only ever be reproduced on
# one. `git checkout` converts line endings according to the machine's own configuration, and
# `sorted(Path)` compares case-insensitively on Windows -- so the same commit materialised
# different bytes in a different order depending on who ran the fetch, and every one of the five
# refused on a Linux runner. The indexer reads these trees, so this was never cosmetic: a corpus
# that differs by platform scores differently by platform, and a frozen corpus that is only
# frozen on one machine is not frozen.
#
# `fetch_commit` now passes `core.autocrlf=false` and `core.eol=lf`, and both walks key on the
# POSIX path string rather than on a `Path`. The digests below are the result, verified on two
# platforms rather than asserted: identical output from this repository's script on Windows and
# from an independent implementation of the same rule inside a `python:3.12-slim` container.
#
# All five move, and an earlier draft of this note claimed two of them did not. That claim was
# wrong and is recorded rather than deleted: `turbo` and `fireship-server` were the two whose
# post-fix Windows digest already equalled what a Linux CI run printed, and reading that as
# "unchanged" confused the materialisation converging with the pin being right. Every pin here
# was a Windows-derived value, so every one of the five is replaced.
#
# The corpus axes did not move across the 2026-07-29 change, measured rather than assumed: binding
# precision 1.0000 at n=16 and binding recall 1.0000 at n=16 before and after, with 4
# falsifiable negatives and 12 of 12 pairs scored either way. The files that arrived are files
# the scorer skips, so the mapping the indexer runs over is the same mapping.

