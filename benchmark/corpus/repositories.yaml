# The repositories the frozen corpus is scored over, pinned by commit.
#
# `benchmark/corpus/README.md` argues the selection. `scripts/fetch_corpus_repositories.py`
# turns this file into trees under the gitignored `.cache/corpus/`, and refuses when a
# materialised tree does not match the digest recorded here.
#
#   name         what the specifications and the score name this checkout by
#   repo         owner/name on GitHub
#   commit       the pin; the fetch asks for this commit by name rather than for a branch
#   subpath      the directory inside that checkout the score is taken over, when the
#                repository's `package.json` is not at its root
#   tree_digest  SHA-256 over every materialised path and the SHA-256 of its bytes, sorted.
#                What the commit pins is what the vendor published; this pins what the fetch
#                produced from it, including the UTF-8 pruning the fetcher documents.

