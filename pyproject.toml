[project]
name = "sync"
version = "0.1.0"
description = "Watches the third-party APIs your code calls and opens verified pull requests when one of them breaks."
readme = "README.md"
authors = [
    { name = "Sebastian", email = "165098826+stroland02@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "api", "openapi", "breaking-changes", "dependency-management",
    "static-analysis", "codemod", "stripe", "developer-tools",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ast-grep-py>=0.45.0",
    "claude-agent-sdk>=0.2.128",
    "cryptography>=49.0.0",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    # The reference models for the MCP wire format, used to parse a watched server's
    # `tools/list` capture. Present transitively via claude-agent-sdk today; declared here
    # because sync.signals.mcp_server imports it directly and a transitive dep can vanish in a
    # bump. Note this is not what `sync.mcp` uses -- that serves the protocol by hand.
    "mcp>=1.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    # Generated-SDK manifests are YAML. Present transitively via langchain-core today; declared
    # here because sync.signals imports it directly and a transitive dep can vanish in a bump.
    "pyyaml>=6.0.3",
    # The plugin SDK, built from `src/pyproject.toml` out of the same tree. Pinned exactly
    # because the two are released together and `sync` imports core's models directly, so a
    # runtime paired with a core it was not built against is a shape nobody tested.
    "starlette>=0.49.0",
    "sync-core==0.1.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn>=0.35.0",
]

[project.urls]
Homepage = "https://github.com/stroland02/sync"
Repository = "https://github.com/stroland02/sync"
Documentation = "https://github.com/stroland02/sync/tree/main/docs/superpowers/specs"
Issues = "https://github.com/stroland02/sync/issues"

[project.scripts]
sync = "sync.cli:main"
# The name a review agent starts. Open Code Review launches each MCP server as a subprocess by
# command, so `sync-mcp` is how the stdio transport is reached at all --
# `docs/integrations/opencodereview/config.json` names it, and the two have to agree.
sync-mcp = "sync.mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["src"]

[tool.uv.sources]
sync-core = { workspace = true }

[tool.uv.build-backend]
# `sync/core` belongs to the `sync-core` wheel. Excluded from this one so the two distributions
# never own the same files -- uninstalling either would otherwise take core out from under the
# other. The source tree keeps it where it is; only the wheel is split.
wheel-exclude = ["core/**"]

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.5.0",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `scripts/` holds build-time tooling that is tested but deliberately not part of the
# shipped package, so it is importable from tests without being installed.
pythonpath = ["."]
# `-n auto` here rather than in the CI workflow, so a developer and CI run the same
# scheduler. The suite is subprocess-bound -- `git`, `tsc`, `oasdiff` -- and 12 workers
# take it from 133s to 46s; the default `--dist load` is what those numbers are from,
# and `--dist loadfile` is 78s because three files hold 79% of the wall clock.
# Spinning up workers costs about 4s flat, so use `-n0` for a focused run.
addopts = "-m 'not e2e' -n auto"
# The watchdog B132 bought, kept because it is what found B132. A single unbounded wait makes
# the whole gate unreadable: an operator cannot tell a starved run from a stuck one, so they
# kill it, and then nothing is known about the other 1800 tests either. This turns any future
# hang into a named test, a stack and a failure. The bound is deliberately far above anything
# healthy -- the slowest test here spawns a child pytest with its own 600 s ceiling -- so it
# fires on a defect and never on a loaded host.
timeout = 900
# `thread` is not a preference: `signal` needs SIGALRM, which Windows does not have, and this
# is the machine the local gate runs on.
timeout_method = "thread"
markers = [
    "e2e: end-to-end test; makes network and model calls",
    "docker: requires a working local Docker Desktop with Linux containers",
]

[tool.importlinter]
root_package = "sync"
# Required for the model-SDK contract below: without it the graph stops at Sync's own
# packages, and a forbidden module outside them cannot be named at all.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "sync.core depends on nothing"
type = "forbidden"
source_modules = ["sync.core"]
forbidden_modules = [
    "sync.graph",
    "sync.signals",
    "sync.index",
    "sync.detect",
    "sync.telemetry",
    "sync.remediate",
    "sync.forge",
    "sync.route",
    "sync.cli",
    "sync.obs",
    "sync.api",
    "sync.benchmark",
    "sync.dashboard",
    "sync.mcp",
    "sync.verify",
    "sync.rehearse",
    "sync.context",
    "sync.runner",
]

[[tool.importlinter.contracts]]
name = "sync.rehearse cannot import sync.forge"
type = "forbidden"
source_modules = ["sync.rehearse"]
forbidden_modules = ["sync.forge"]

# M8's seam, stated as the property it defends rather than as a layering preference: the
# remediation pipeline runs without a model. `sync.runner` owns every line that knows a model
# SDK exists, so a test can drive `locate -> patch -> verify` against a runner that returns a
# fixed result and needs no key and no network.
[[tool.importlinter.contracts]]
name = "sync.remediate cannot import a model SDK"
type = "forbidden"
source_modules = ["sync.remediate"]
forbidden_modules = ["claude_agent_sdk"]
# The chain `agent_patch -> sync.runner -> claude_agent_sdk` is the seam, not a violation of
# it: what this defends is that no module in `sync.remediate` names the SDK itself, so
# substituting a runner substitutes every line that knows a model exists. Forbidding the
# chain would forbid the arrangement the contract was written to require.
allow_indirect_imports = true

