[project]
name = "sync"
version = "0.1.0"
description = "Watches the third-party APIs your code calls and opens verified pull requests when one of them breaks."
readme = "README.md"
authors = [
    { name = "Sebastian Roland", email = "sebastian.roland@janco-electronics.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.128",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "tree-sitter>=0.26.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
sync = "sync.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: end-to-end test; makes network and model calls"]

[tool.importlinter]
root_package = "sync"

[[tool.importlinter.contracts]]
name = "sync.core depends on nothing"
type = "forbidden"
source_modules = ["sync.core"]
forbidden_modules = [
    "sync.graph",
    "sync.signals",
    "sync.index",
    "sync.detect",
    "sync.remediate",
    "sync.forge",
    "sync.cli",
]
