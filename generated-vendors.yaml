# Vendors served by reading the manifest their SDK generator commits.
#
# Adding one is this file and nothing else. `docs/superpowers/specs/2026-07-27-sync-adapter-targets.md`
# has the argument: supporting a generator costs a day and yields every vendor using it, while
# supporting one more vendor under a known generator costs a configuration line. Coverage stops
# scaling with vendor count and starts scaling with generator count, and there are few generators.
#
# Four fields, none of which is knowledge about the vendor's API:
#
#   vendor_id     what `--vendor` selects, and what every row this vendor produces is keyed by
#   repo          owner/name of the repository the generated SDK lives in
#   manifest      `.stats.yml` for Stainless, `.speakeasy/workflow.yaml` for Speakeasy
#   sdk_bindings  which package a customer imports to reach this vendor, per language
#
# A language binding carries up to three names, because they come apart independently and only
# an unscoped vendor collapses them: `package` is what the manifest declares, `module` is what
# source imports (Python only -- an npm package name is also its import specifier), and
# `symbol_root` is what an emitted symbol is rooted at. `symbol_root` defaults to the package
# on TypeScript and to the module on Python, so a vendor whose names agree declares none.
#
# Everything about the specification -- where it is, whether it moved, how many operations it
# describes -- comes from the manifest itself. That is what the generator writes for its own
# reasons, which is why no vendor has to cooperate and no agreement can be withdrawn.
#
# `sdk_bindings` meets the same standard: a package name, a distribution name and a module name
# are packaging facts. A URL convention, an `operationId` scheme or an SDK method-naming rule is
# knowledge about an API and does not belong here. Without it a configured vendor could be
# diffed and never matched -- `sync.index` reads this to decide whether a repository depends on
# the vendor at all -- so a vendor with no binding was a vendor nothing in a customer's code was
# ever bound to.
#
# The field is optional and a vendor declaring none falls back to a guess derived from its id.
# **A vendor that declares any language has spoken completely**, and a declared mapping missing a
# language yields no binding for that language rather than falling back; vercel below is that
# case. `sync.signals.generated.adapter.bindings_for` carries the reasoning.
#
# **Every entry below was confirmed by fetching the path on 2026-07-28**, the same method the
# spec used to verify a target, and the four responses are committed under
# `tests/fixtures/manifests/`. An entry pointing at a repository that does not exist is a runtime
# failure wearing the costume of support: it registers, it is offered on the command line, and it
# fails on the first scan. The spec records `sendgrid/sendgrid-oai` and `workos/workos-openapi`
# as not existing and Resend and PostHog as unresolved -- none of them belongs here until
# somebody probes and finds one.
#
# **Every `sdk_bindings` name below was confirmed on 2026-07-29** by reading each SDK
# repository's own `package.json` or `pyproject.toml` -- the artifact the vendor publishes, not a
# package registry's index of it -- and those seven files are committed under
# `tests/fixtures/sdk_packages/`. `tests/test_generated_bindings.py` asserts each name here still
# equals the one in the committed manifest, so this file cannot drift away from the evidence. A
# binding nobody checked is worse than none, because it moves a vendor from honestly-unwatchable
# to apparently-watched.
#
# A deployment with its own set points `SYNC_GENERATED_VENDORS` at another file.

- vendor_id: anthropic
  repo: anthropics/anthropic-sdk-python
  manifest: .stats.yml
  # The worked example of why a binding is per-language rather than per-vendor: the same vendor
  # is `anthropic` on PyPI, where a guess derived from the id resolves, and `@anthropic-ai/sdk`
  # on npm, where it fails. No rule for deriving one from the id is right for both.
  sdk_bindings:
    typescript:
      # `@anthropic-ai/sdk` is a manifest key and an import specifier and cannot be a symbol
      # root: nothing keys a map on a string with a slash in it. Rooted at `anthropic` so one
      # map serves both languages -- the Python distribution and module are `anthropic`
      # (confirmed 2026-07-29 from `anthropics/anthropic-sdk-python`, committed under
      # `tests/fixtures/sdk_packages/`), and a symbol identifies an operation rather than a
      # package. No symbol map for this vendor exists yet, so this is the convention the first
      # one should follow rather than a key read off an existing map.
      package: "@anthropic-ai/sdk"
      symbol_root: anthropic
    python:
      distribution: anthropic
      module: anthropic

- vendor_id: openai
  repo: openai/openai-python
  manifest: .stats.yml
  sdk_bindings:
    typescript:
      package: openai
    python:
      distribution: openai
      module: openai

# Publishes `configured_endpoints` and no specification URL, which is a coverage gap this
# approach does not close. Configured anyway: the adapter reports it rather than raising, the
# endpoint count is a free coverage denominator, and a vendor absent from this file looks
# identical to one nobody has looked at.
- vendor_id: cloudflare
  repo: cloudflare/cloudflare-python
  manifest: .stats.yml
  sdk_bindings:
    typescript:
      package: cloudflare
    python:
      distribution: cloudflare
      module: cloudflare

# The other generator, and the proof the mechanism is not Stainless-specific. Its manifest names
# `https://openapi.vercel.sh/` -- the vendor's own host rather than a generator mirror -- so
# adopting a second convention changed the manifest name on this line and nothing else.
- vendor_id: vercel
  repo: vercel/sdk
  manifest: .speakeasy/workflow.yaml
  # TypeScript only, and the omission is deliberate rather than unfinished: `vercel/sdk` has a
  # `package.json` and a `tsconfig.json` and no `pyproject.toml`, so there is no Python
  # distribution to name. Adding one would invent a package that does not exist, and the rule
  # above is what stops the fallback supplying it.
  sdk_bindings:
    typescript:
      # Scoped for the same reason and rooted at the vendor id, which is what the SDK's own
      # usage example binds its client to (`const vercel = new Vercel(...)`, USAGE.md, read
      # 2026-07-29). There is no Python target, so nothing constrains this from the other side.
      package: "@vercel/sdk"
      symbol_root: vercel

# --- Added 2026-08-18, each manifest fetched live the same day and committed under
# tests/fixtures/manifests/; each Python binding read from the SDK's own pyproject.toml,
# committed under tests/fixtures/sdk_packages/. Python declared only: every entry below has
# spoken for Python and deliberately not for TypeScript, whose npm packages await their own
# fetched evidence -- a binding nobody checked is worse than none.

- vendor_id: modern-treasury
  repo: modern-treasury/modern-treasury-python
  manifest: .stats.yml
  sdk_bindings:
    python:
      distribution: modern-treasury
      module: modern_treasury

- vendor_id: lithic
  repo: lithic-com/lithic-python
  manifest: .stats.yml
  sdk_bindings:
    python:
      distribution: lithic
      module: lithic

- vendor_id: increase
  repo: Increase/increase-python
  manifest: .stats.yml
  sdk_bindings:
    python:
      distribution: increase
      module: increase

- vendor_id: finch
  repo: Finch-API/finch-api-python
  manifest: .stats.yml
  # Distribution and module come apart here -- `finch-api` on PyPI, `finch` at import -- which
  # is the Python half of the anthropic lesson above.
  sdk_bindings:
    python:
      distribution: finch-api
      module: finch

- vendor_id: orb
  repo: orbcorp/orb-python
  manifest: .stats.yml
  # `orb-billing` on PyPI, `orb` at import: the same two-name case as finch.
  sdk_bindings:
    python:
      distribution: orb-billing
      module: orb

- vendor_id: groq
