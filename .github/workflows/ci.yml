name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The nightly exists for one job: `coverage` selects it by `if`, and every other job
  # excludes it. 03:43 UTC rather than a round hour, because GitHub sheds top-of-hour
  # scheduled load and a shed run reports nothing at all.
  schedule:
    - cron: "43 3 * * *"
  # Runs everything, including the jobs the triggering event would normally skip. This is
  # the on-demand path for the serial and coverage jobs, and the way to measure a branch's
  # workflow shape without opening a pull request.
  workflow_dispatch:

# `github.event_name` is in the group because `schedule` and a push to `main` otherwise
# share `refs/heads/main`: a nightly landing beside a push would cancel one of them, and a
# cancelled run reads as a red build to anyone not checking step counts -- the same
# misreading B112 documents. Within one pull request the behaviour is unchanged: successive
# pushes share an event and a ref, so a superseded run is still cancelled rather than
# finishing late against dead code.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The nightly is coverage's alone; this gate already ran for the push that put `main`
    # where the nightly would find it.
    if: github.event_name != 'schedule'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sync
          POSTGRES_PASSWORD: sync
          POSTGRES_DB: sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sync"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # docker-compose.yml maps Postgres to 5433 to stay clear of a local server.
      # A service container has the port to itself, so the default DSN is overridden
      # rather than the mapping reproduced. The `serial` job below does the opposite,
      # and the comment there says why the choice is not free.
      SYNC_DSN: postgresql://sync:sync@localhost:5432/sync

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `.oasdiff-version` is the pin, and `scripts/bootstrap_tools.sh` reads that same file, so
      # a job here and a developer's checkout cannot drift apart. The last three lines assert
      # rather than print: a version that is only echoed is a version nobody checks, which is
      # how a pinned job and seven working copies came to run two different builds.
      - name: Install oasdiff
        run: |
          version="$(grep -m1 -Ev '^[[:space:]]*(#|$)' .oasdiff-version)"
          version="${version//[[:space:]]/}"
          mkdir -p tools
          curl -fsSL -o /tmp/oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${version}/oasdiff_${version}_linux_amd64.tar.gz"
          tar -xzf /tmp/oasdiff.tar.gz -C tools oasdiff
          installed="$(tools/oasdiff --version)"
          if [ "$installed" != "oasdiff version ${version}" ]; then
            echo "pinned v${version} in .oasdiff-version, installed '${installed}'" >&2
            exit 1
          fi
          echo "$installed"

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      # Runs before the suite: a failure here is a fact about the source, and needs no
      # database, no binary, and no test run to establish.
      - name: Encoding lint
        run: uv run python scripts/lint_encoding.py src scripts tests

      - name: Import boundary
        run: uv run lint-imports

      # Being tested and being reachable are different properties, and until this step
      # existed only the first was checked -- four finished components shipped with no
      # caller anywhere in src/. The baseline lists the ones already accepted and only
      # shrinks: an entry that no longer violates fails here until it is deleted.
      - name: Dead links
        run: uv run python scripts/lint_dead_links.py src --baseline scripts/dead_links_baseline.txt

      # A skipped test reports as neither pass nor fail, so a skip with no real reason is a
      # test that cannot fail wearing a different shape. Every skip in `tests/` must name a
      # platform or an absent local toolchain -- `.claude/rules/test-discipline.md` carries
      # the doctrine, this is the gate.
      - name: Test skip discipline
        run: uv run python scripts/lint_test_skips.py tests

      # `sync.index.tsc.run_tsc` falls back to `npx --yes --package=typescript@latest` whenever a
      # clone has no TypeScript of its own, which is every fixture in this suite. `addopts` runs
      # pytest under `-n auto`, so several workers reach that fallback at once against a cold
      # `~/.npm/_npx` cache -- one worker is still writing the package while another execs
      # `node .../typescript/lib/tsc.js`, and Linux answers `ETXTBSY`. It surfaces as a patch that
      # abandoned with "could not establish a typecheck baseline", which reads as a defect in the
      # gate rather than in the machine running it. Run the resolver once, serially, so every
      # worker afterwards finds an installed and unwritten cache entry.
      #
      # This warms a shared cache; it does not make the fallback concurrency-safe. B101 carries
      # that, because two Sync remediations on one host hit the same race with no CI step in
      # front of them.
      - name: Warm the TypeScript npx cache
        run: npx --yes --silent --package=typescript@latest tsc --version

      # Before the suite, not after it. `sync.rehearse.fixture` refuses without `.cache/corpus`
      # and names this script in the refusal, so a fetch that runs later is a step a reader sees
      # and a resource the suite never had -- five rehearsal tests failed on every run for
      # exactly that reason. The cache saves the network round trip and nothing else: the script
      # still materialises every tree and still checks it against the digest
      # `repositories.yaml` pins, so a cache hit is verified rather than trusted.
      - name: Cache the frozen corpus
        uses: actions/cache@v4
        with:
          path: .cache/corpus
          key: corpus-${{ hashFiles('benchmark/corpus/repositories.yaml') }}

      - name: Fetch the frozen corpus
        run: uv run python scripts/fetch_corpus_repositories.py

      - name: Tests
        run: |
          set -o pipefail
          uv run pytest 2>&1 | tee suite-test.log

      # A tally is only a result if the run that produced it finished. A crashed xdist worker
      # prints `F` against every test it never reached, so `60 failed` and `1 failed` can describe
      # the same tree -- B152 measured exactly that, three times in one morning. `gate_verdict.py`
      # answers whether the verdict can be believed, which is a different question from whether
      # the suite passed, and it runs on failure too because that is the case it exists for.
      # `set -o pipefail` is load-bearing: without it the step reports `tee`'s status, and a
      # failing suite passes straight through -- the same defect the coverage step below was
      # fixed for, which this capture would otherwise reintroduce here.
      - name: Was that run trustworthy
        if: always()
        run: uv run python scripts/gate_verdict.py suite-test.log

      # The corpus has two frozen inputs and this job used to stage one of them. `repositories.yaml`
      # pins the trees; `symbol_map.yaml` pins the map that decides which call sites resolve at
      # all, and it lives in gitignored `.cache/specs/` because it is generated and large. With
      # nothing staging it, `score_corpus.py` refused every time it was reached -- `no symbol map
      # at .cache/specs/symbols.json` -- so the binding gate below has never once run on a runner.
      # The step before this one was failing for longer, which is what hid it.
      #
      # Both scripts verify what they write before writing it: a git blob hash per specification,
      # and the pinned digest for the map. Neither can quietly substitute an input.
      - name: Stage the pinned Stripe specifications
        # `gh_raw` shells out to the `gh` CLI, which refuses to run inside Actions without
        # `GH_TOKEN` even against a public repository. The workflow's own token is enough:
        # this reads `stripe/openapi` at a pinned tag, and the job's permissions are read-only.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/fetch_measurement_inputs.py

      - name: Stage the pinned symbol map
        run: uv run python scripts/stage_symbol_map.py

      # A database of its own. `score_corpus.py` truncates the graph once per pair, so pointing
      # it at the one the suite used would delete what a later step might read.
      - name: Score the frozen corpus
        run: |
          uv run python -c "
          import psycopg
          from psycopg import sql
          with psycopg.connect('postgresql://sync:sync@localhost:5432/postgres', autocommit=True) as c:
              c.execute(sql.SQL('DROP DATABASE IF EXISTS {} WITH (FORCE)').format(sql.Identifier('sync_benchmark')))
              c.execute(sql.SQL('CREATE DATABASE {}').format(sql.Identifier('sync_benchmark')))
          "
          uv run python scripts/score_corpus.py \
            --score-dsn postgresql://sync:sync@localhost:5432/sync_benchmark \
            --json corpus-score.json

      # The first gate on a quality number rather than on correctness, and the only one
      # `2026-07-27-sync-benchmark-gates.md` allows today: a directional floor on a
      # deterministic axis. The floors are not here. They are in `scripts/gate_corpus.py`,
      # beside the figure each one guards and the argument for guarding it, because a floor in
      # a workflow file is a string a reader meets without the number it came from and lowering
      # one is a config tweak rather than a reviewable act.
      - name: Binding floors over the frozen corpus (gated)
        run: uv run python scripts/gate_corpus.py --score corpus-score.json

      # Rehearsal smoke gate: runs the zero-remote rehearsal against the fixture with --depth prepare
      # and asserts that every selected finding reached a terminal checkpoint (B78 Task 6).
      - name: Pipeline rehearsal smoke (gated)
        run: |
          uv run python -c "
          import psycopg
          from psycopg import sql
          with psycopg.connect('postgresql://sync:sync@localhost:5432/postgres', autocommit=True) as c:
              c.execute(sql.SQL('DROP DATABASE IF EXISTS {} WITH (FORCE)').format(sql.Identifier('sync_rehearse')))
              c.execute(sql.SQL('CREATE DATABASE {}').format(sql.Identifier('sync_rehearse')))
          "
          uv run sync rehearse \
            --depth prepare \
            --vendor stripe \
            --from-version v2320 \
            --to-version v2330 \
            --dsn postgresql://sync:sync@localhost:5432/sync_rehearse
          uv run python scripts/rehearse_smoke.py \
            --dsn postgresql://sync:sync@localhost:5432/sync_rehearse


  # The scheduler `addopts` never selects, run in the one configuration where it can fail.
  #
  # `-n0` is contracted here rather than a debugging convenience: `pyproject.toml` names it for a
  # focused run, and `2026-07-29-sync-verification-regime.md` names it as the way to run the e2e
  # test at all, because `addopts` deselects that test and pins the scheduler in one string.
  # Nothing verified it, and it was broken on `main` for an unknown length of time -- 186 errors
  # from one cause, `docs/superpowers/reports/2026-07-30-n0-is-broken.md`. The whole suite rather
  # than the database-touching part of it: the defect class is one test breaking a later test in
  # the same process, so any rule that picks a subset picks victims while the breaker is whatever a
  # new test brings. `2026-07-30-ci-does-not-run-serial.md` carries the cost this buys with.
  #
  # A job of its own rather than a step in `test`, because it needs the opposite database
  # configuration and that is the whole of why it can fail. **No `SYNC_DSN` here, deliberately.**
  # `conftest.database_for` returns None for a serial run handed a pin, so no per-run database is
  # created and the sweep this job watches has nothing of the run's to take -- and under `-n auto`
  # a pin yields `sync_gw0`, which is outside `LEAKED_DATABASE_PATTERN` as well. Measured on the
  # broken tree: the recipe that reproduces the defect in 33 s unpinned is green under `test`'s
  # pin. A serial step inside `test` would have stayed green through all 186 errors, and
  # `tests/test_ci_runs_the_serial_scheduler.py` refuses a pin here for that reason.
  serial:
    runs-on: ubuntu-latest
    # Off the pull-request path as of CI-W167 (B111), and the condition is an event, not a
    # path filter -- `2026-07-30-ci-does-not-run-serial.md` already rejected subsetting this
    # job, and a path filter is the same rejection arriving as a trigger. Every change
    # reaches `main` as a fast-forward push, and every such push runs this job, so nothing
    # lands without a serial run at its landing; a pull request loses only the second copy
    # of a check its author already ran, because `-n0` is the local gate every brief
    # mandates. What a pull request's green no longer says is "serial passed" -- it says
    # the gate passed and serial runs when this lands. Not on `schedule`: the nightly is
    # coverage's, and `main` cannot change without a push that ran this.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sync
          POSTGRES_PASSWORD: sync
          POSTGRES_DB: sync
        ports:
          # `conftest.DEFAULT_DSN`, reproduced rather than overridden. `test` overrides the DSN
          # instead and is right to -- but that override is exactly what hides the defect this
          # job exists for, so here the mapping moves and the DSN does not.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sync"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Duplicated from `test` rather than shared, and the version cannot drift with it: both read
      # `.oasdiff-version`, so what is copied is the mechanism and not the number.
      # `tests/test_oasdiff.py` calls the binary with no skip guard, so a job without it errors
      # rather than quietly running a smaller suite -- which is why this is here and not omitted.
      - name: Install oasdiff
        run: |
          version="$(grep -m1 -Ev '^[[:space:]]*(#|$)' .oasdiff-version)"
          version="${version//[[:space:]]/}"
          mkdir -p tools
          curl -fsSL -o /tmp/oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${version}/oasdiff_${version}_linux_amd64.tar.gz"
          tar -xzf /tmp/oasdiff.tar.gz -C tools oasdiff
          installed="$(tools/oasdiff --version)"
          if [ "$installed" != "oasdiff version ${version}" ]; then
            echo "pinned v${version} in .oasdiff-version, installed '${installed}'" >&2
            exit 1
          fi
          echo "$installed"

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      # Duplicated from `test` for the reason the oasdiff install above is duplicated: what is
      # copied is the mechanism, and the pin it reads is one file. This job runs the whole suite,
      # so it needs every resource the suite needs -- and it had none of this, which is why three
      # rehearsal tests failed here on every push to `main`. No corpus *gate* here: the score and
      # its floors are a fact about a frozen input that a scheduler cannot change, and running
      # them twice buys a second copy of one answer. The trees are not the gate; they are what
      # the suite reads.
      - name: Cache the frozen corpus
        uses: actions/cache@v4
        with:
          path: .cache/corpus
          key: corpus-${{ hashFiles('benchmark/corpus/repositories.yaml') }}

      - name: Fetch the frozen corpus
        run: uv run python scripts/fetch_corpus_repositories.py

      # Gated, and the only gate here. No lints: those are facts about the source, and running
      # them twice buys a second copy of the same answer.
      - name: Tests, serial scheduler
        run: |
          set -o pipefail
          uv run pytest -q -n0 2>&1 | tee suite-serial.log

      # Same argument as `test`. `-n0` has no workers to lose, but it can still be killed before
      # its summary, and a run with no summary line is not a result either.
      - name: Was that run trustworthy
        if: always()
        run: uv run python scripts/gate_verdict.py suite-serial.log

  # Recorded, never gated. `2026-07-27-sync-benchmark-gates.md` forbids inventing a
  # threshold -- a gate at an invented number either fires constantly and gets disabled or
  # never fires and provides false assurance -- and a percentage that fails a build is a
  # percentage people write tests to satisfy rather than to test something.
  #
  # A job of its own, nightly plus on demand, rather than a step in `test` (CI-W167, B111).
  # Nothing gates on this number and nobody waits for it, so it was 80s of every pull
  # request's critical path buying nothing a reviewer reads. The number's purpose is the
  # recorded series against `docs/superpowers/specs/2026-07-29-sync-coverage-baseline.md`,
  # and a nightly point serves a series as well as a per-push one. That baseline also
  # records what this number cannot see -- seven components shipped fully covered and
  # reachable from nothing, every one healthy to a line count.
  #
  # The environment is `test`'s, not `serial`'s, deliberately: coverage records the suite in
  # the configuration the gate runs -- `-n auto` via `addopts`, `SYNC_DSN` pinned to the
  # service port. It has never run the serial configuration and does not claim to; the
  # `serial` job is what reaches those defects. The npx warm is needed for the same reason
  # it is needed in `test`: several `-n auto` workers reaching a cold cache answer `ETXTBSY`.
  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sync
          POSTGRES_PASSWORD: sync
          POSTGRES_DB: sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sync"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      SYNC_DSN: postgresql://sync:sync@localhost:5432/sync

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Duplicated from `test` like `serial`'s copy, and for the same reason: both read
      # `.oasdiff-version`, so what is copied is the mechanism and not the number, and
      # `tests/test_oasdiff.py` calls the binary with no skip guard.
      - name: Install oasdiff
        run: |
          version="$(grep -m1 -Ev '^[[:space:]]*(#|$)' .oasdiff-version)"
          version="${version//[[:space:]]/}"
          mkdir -p tools
          curl -fsSL -o /tmp/oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${version}/oasdiff_${version}_linux_amd64.tar.gz"
          tar -xzf /tmp/oasdiff.tar.gz -C tools oasdiff
          installed="$(tools/oasdiff --version)"
          if [ "$installed" != "oasdiff version ${version}" ]; then
            echo "pinned v${version} in .oasdiff-version, installed '${installed}'" >&2
            exit 1
          fi
          echo "$installed"

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Warm the TypeScript npx cache
        run: npx --yes --silent --package=typescript@latest tsc --version

      # Duplicated from `test` for the same reason as the oasdiff install: this job runs the
      # whole suite, so it needs what the suite reads.
      - name: Cache the frozen corpus
        uses: actions/cache@v4
        with:
          path: .cache/corpus
          key: corpus-${{ hashFiles('benchmark/corpus/repositories.yaml') }}

      - name: Fetch the frozen corpus
        run: uv run python scripts/fetch_corpus_repositories.py

      # **The coverage number is still not gated, and the suite now is.** Those are different
      # claims and the step used to collapse them. No `--cov-fail-under` is passed here, so
      # coverage cannot produce an exit code of its own and cannot fail this job -- that part of
      # `2026-07-27-sync-benchmark-gates.md`'s refusal is intact and is the part that matters.
      # What the step also discarded was pytest's own verdict: it captured the status and
      # re-raised only above 1, and a failing test is exactly 1. Since `test` and `web` both
      # exclude the nightly and `serial` runs only on a push, this job is the whole of what a
      # scheduled run executes -- so nothing on a schedule could report anything but success.
      # Measured rather than argued: the nightly of 2026-08-17 (`31994303030`) is recorded
      # `success` and its own log ends `5 failed, 3632 passed, 7 skipped`. A green tick that
      # cannot go red is not a check.
      #
      # A dotted `--cov=sync` does legitimately change behaviour here
      # (`2026-07-29-psycopg-error-identity.md`), which is what the discarded exit code used to
      # be defended with. That is a difference worth seeing rather than swallowing, and
      # `tests/test_psycopg_error_identity.py` is where it is pinned.
      #
      # What the nightly covers now: the Python suite under `-n auto` against the service
      # database, with coverage recorded. Not the lints, not the corpus score and its floors,
      # not `web` -- each of those runs on the push that put `main` where the nightly found it.
      - name: Coverage (recorded) and the suite (gated)
        run: |
          set -o pipefail
          uv run pytest -q --cov=sync --cov-report=term-missing:skip-covered 2>&1 | tee suite-coverage.log

      # This job is the whole of a scheduled run, so an unreadable verdict here is a nightly that
      # reports nothing at all -- the same shape as the discarded exit code above, one step later.
      - name: Was that run trustworthy
        if: always()
        run: uv run python scripts/gate_verdict.py suite-coverage.log

  # No Postgres and no Python: `web/` is a standalone Vite + React console, not part of the
  # graph pipeline `test` and `serial` exercise, so coupling it into either job would fail
  # this gate on every unrelated INDEX/SIGNAL/DETECT change and vice versa.
  web:
    runs-on: ubuntu-latest
    # Same reason as `test`: the nightly is coverage's alone.
    if: github.event_name != 'schedule'

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      # web/package-lock.json pins react-router 8.3.0, whose own `engines` field is
      # ">=22.22.0" -- a runner below that floor makes `npm ci` warn, and fails it outright
      # under engine-strict.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # oxlint's exit code reflects error-level violations only; the one live warning
      # (web/src/components/ui/button.tsx, vendored shadcn code) does not fail this step.
      # A new error-level violation does.
      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so a type error anywhere in the console
      # fails here -- this is the gate the three hand-mirrored constants and the
      # WorkflowOutcome union needed and never had.
      - name: Build
        run: npm run build

      # Vitest over jsdom. Scope is classification, derivation and structural invariants --
      # `isRunTerminal`, `hasLiveRun`, the cardinality threshold, an option counted at zero,
      # `describeRung`'s exhaustiveness, `formatElapsed`, and every declared route being
      # reachable from the shell. Never class names, never snapshots: a snapshot in a console
      # being actively restyled fails on every correct change and gets deleted by whoever it
      # blocks. Needs no database and no Python, which is why it belongs in this job and not
      # in `test`.
      - name: Test
        run: npm test
