<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sync — operator console</title>
    <script>
      /* Runs before the module graph loads, so the class lands before first paint. Mirrors
         the resolution order in src/lib/theme.ts: an explicit stored choice, else
         prefers-color-scheme, else light. Kept in sync by hand — an inline script cannot
         import that module. */
      (function () {
        var dark = false
        try {
          var stored = window.localStorage.getItem("sync-theme")
          dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
        } catch (e) {
          dark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        }
        if (dark) document.documentElement.classList.add("dark")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
