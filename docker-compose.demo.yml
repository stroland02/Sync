# The whole product, from nothing, with Docker as the only prerequisite.
#
#     docker compose -f docker-compose.demo.yml up --build
#
# and then http://127.0.0.1:4173 with the password the log prints.
#
# **Why this is a second file rather than the existing `docker-compose.yml`.** That file serves the
# development Postgres on port 5433 that every working session on this machine is currently using,
# and adding an application service to it would make an ordinary `docker compose up -d` start
# building an image those sessions do not want. This file is self-contained instead: its own
# database, its own volume, its own network, nothing shared and nothing to collide with. Folding
# the two together is a fair thing to do once the ship crunch is over; doing it now would break
# five other lanes' gate runs to save a filename.
#
# **Nothing is published except the console.** The database gets no host port -- it would collide
# with 5433 and nothing outside needs it -- and the API is reached only through the console's own
# `/api` proxy, which is where the credential gate lives.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync
      POSTGRES_DB: sync
    # Durability is traded deliberately here, the same trade `docker-compose.yml` documents at
    # length: everything in this database is rebuilt by the entrypoint on the next start, so an
    # unclean shutdown costs nothing and the speed is worth having on a first run somebody is
    # watching.
    command:
      - "postgres"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
    volumes:
      - sync-demo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync"]
      interval: 2s
      timeout: 3s
      retries: 30

  sync:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNC_GRAPH_DSN: postgresql://sync:sync@postgres:5432/sync
      # A default so the one command is genuinely one command. It is not a secret and is not
      # pretending to be: the console is published on loopback only, and the entrypoint prints
      # this value on startup precisely so nobody has to go looking for it. Override it by
      # exporting SYNC_CONSOLE_PASSWORD before `up` if this instance is reachable by anyone else.
      SYNC_CONSOLE_PASSWORD: ${SYNC_CONSOLE_PASSWORD:-sync-local-demo}
    ports:
      # Bound to 127.0.0.1 rather than 0.0.0.0: deployment is local-only, and a demo that quietly
      # listens on every interface is a different product decision than the one that was made.
      - "127.0.0.1:4173:4173"
    # So `docker compose up --wait` and the `npx` doorbell can say "it is ready" from the
    # container's own answer rather than from a sleep. It asks for a 401, not a 200: unauthenticated
    # is what a healthy console returns to a request carrying no credential, and a check that
    # accepted any response would go green on the error page too.
    #
    # `start_period` covers the entrypoint's real work -- waiting for Postgres, applying the schema,
    # starting the API and waiting for it to answer -- during which failures are not counted, so a
    # slow first boot does not mark the service unhealthy before it has had a chance.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "test \"$$(node -e \"fetch('http://127.0.0.1:4173/').then(r=>console.log(r.status)).catch(()=>console.log(0))\")\" = 401"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  sync-demo-db:
