# The vendor knowledge base: every platform Sync can name, whether or not it watches it yet.
#
# One entry per vendor. `scripts/build_integration_docs.py` joins this against
# `sync.signals.registry.registered_adapters()` to generate `docs/integrations/catalog/`, and
# the join is the honesty mechanism: an entry whose id the registry serves renders as
# *supported*; any other entry renders as *recognized* -- Sync can name the dependency and say
# what adding it takes, and claims nothing more. `status` is therefore derived and never written
# here, and a registered vendor's packages come from `generated-vendors.yaml` via the registry
# rather than being copied into this file -- a fact written twice will disagree with itself.
# `tests/test_integration_catalog.py` enforces both.
#
# Licensing fence: no line in this file is copied from Nango's ELv2-licensed catalog (their
# repository shaped the idea; the ruling is in
# `docs/superpowers/plans/2026-08-18-integration-catalog-and-getting-started.md`). Every entry
# is a fact about the vendor itself -- its name, its documentation host, the packages its SDK
# ships under -- written by us and verifiable against the vendor.

# --- registered vendors: display facts only; the registry carries the rest -------------------

